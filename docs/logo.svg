<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 108 108" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Cosmic Obsidian Gradient -->
    <linearGradient id="bgGrad" x1="12" y1="8" x2="96" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141B2D"/>
      <stop offset="40%" stop-color="#0E1322"/>
      <stop offset="100%" stop-color="#070A12"/>
    </linearGradient>

    <!-- Ambient Core Radial Glow -->
    <radialGradient id="ambientGlow" cx="54" cy="54" r="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#06B6D4" stop-opacity="0.16"/>
      <stop offset="75%" stop-color="#8A2BE2" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Rim Subtle Bevel Glow -->
    <linearGradient id="rimGlow" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Facet 1: Violet to Indigo (Left Sovereign Wing) -->
    <linearGradient id="facetViolet" x1="32" y1="84" x2="54" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="45%" stop-color="#7C3AED"/>
      <stop offset="85%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- Facet 2: Electric Cyan to Mint (Right Radiant Wing) -->
    <linearGradient id="facetCyan" x1="52" y1="84" x2="82" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="45%" stop-color="#06B6D4"/>
      <stop offset="85%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Facet 3: Central Prism Flame Core -->
    <linearGradient id="facetCore" x1="44" y1="78" x2="60" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="30%" stop-color="#38BDF8"/>
      <stop offset="65%" stop-color="#818CF8"/>
      <stop offset="85%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <!-- Facet 4: Luminous Diamond Refraction Glint -->
    <linearGradient id="facetApex" x1="50" y1="36" x2="56" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#E0F2FE" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Crystal Drop Shadow -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.8" stdDeviation="3.2" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="1.0" stdDeviation="1.8" flood-color="#4F46E5" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Outer Squircle with Bevel -->
  <rect x="4" y="4" width="100" height="100" rx="23" fill="url(#bgGrad)"/>
  <rect x="4" y="4" width="100" height="100" rx="23" stroke="url(#rimGlow)" stroke-width="0.8"/>

  <!-- Ambient Glow -->
  <circle cx="54" cy="54" r="42" fill="url(#ambientGlow)"/>

  <!-- Crystal Flame Group -->
  <g filter="url(#shadowFilter)">
    <!-- 1. Left Sovereign Wing -->
    <path d="M48.5 83.2 C38.2 82.5 28.5 73.8 28.5 61.2 C28.5 49.5 36.8 40.8 45.2 31.5 C45.6 40.8 41.2 48.6 41.2 57.5 C41.2 66.8 46.2 73.2 53.5 76.5 C51.6 79.2 50.1 82.5 48.5 83.2 Z" 
          fill="url(#facetViolet)"/>

    <!-- 2. Right Radiant Wing -->
    <path d="M53.5 76.5 C65.2 73.5 79.5 64.2 79.5 52.2 C79.5 42.5 71.8 37.8 65.5 32.2 C68.2 38.5 70.2 45.8 67.5 52.2 C64.2 59.5 56.5 63.5 48.5 68.2 C50.8 71.5 52.5 74.2 53.5 76.5 Z" 
          fill="url(#facetCyan)"/>

    <!-- 3. Central Prism Flame Core -->
    <path d="M46.2 77.5 C44.2 66.8 47.2 57.5 52.2 46.8 C54.8 41.5 55.8 35.5 53.8 27.5 C57.5 35.5 62.5 44.8 60.5 55.5 C58.5 64.2 51.5 71.8 46.2 77.5 Z" 
          fill="url(#facetCore)"/>

    <!-- 4. Luminous Diamond Apex -->
    <path d="M53.8 27.5 C53.2 31.8 51.2 37.5 49.2 43.2 C51.5 41.8 54.2 41.2 56.2 42.8 C56.8 38.5 55.8 32.5 53.8 27.5 Z" 
          fill="url(#facetApex)"/>

    <!-- 5. Inner Refraction Spine -->
    <path d="M53.8 28.5 L51.5 45.2 L47.8 66.5 L46.2 77.2" 
          stroke="#FFFFFF" stroke-opacity="0.60" stroke-width="0.6" stroke-linecap="round"/>
  </g>
</svg>
