name: Android CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: [ubuntu-latest]
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Run tests
        run: ./gradlew :app:testDebugUnitTest :shared:jvmTest :feature:subscription:jvmTest :feature:agent:jvmTest

      # Version comes from fdroid.properties; BUILD_VERSION/BUILD_NUMBER override it if set.
      # Built unsigned: Gradle, plugins and dependencies never see the signing key.
      - name: Build release APK (unsigned)
        env:
          CRUX_UNSIGNED_RELEASE: "true"
        run: ./gradlew :app:assembleRelease --stacktrace

      # The only step that receives the signing secrets. It runs no project code.
      - name: Sign release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: bash ./.github/sign_apk.sh

      - name: Verify release APK signing
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APK=dist/app-release.apk
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER=$(ls -1 "${SDK_DIR}/build-tools"/*/apksigner | sort -V | tail -n 1)
          CERT_INFO=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERT_INFO"
          if echo "$CERT_INFO" | grep -qi "Android Debug"; then
            echo "ERROR: Tagged release APK was signed with an Android Debug key!" >&2
            exit 1
          fi
          (cd dist && sha256sum app-release.apk > SHA256SUMS && cat SHA256SUMS)

      - name: Upload APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crux-release-apk
          path: dist/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [ubuntu-latest]
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: crux-release-apk
          path: release-apk

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-apk/app-release.apk

      - name: Resolve Changelog Path
        id: changelog
        run: |
          CODE=$(grep versionCode fdroid.properties | cut -d'=' -f2 | tr -d ' ')
          CL="fastlane/metadata/android/en-US/changelogs/${CODE}.txt"
          if [[ -f "$CL" ]]; then
            echo "path=$CL" >> $GITHUB_OUTPUT
          else
            echo "path=README.md" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            release-apk/app-release.apk
            release-apk/SHA256SUMS
          name: Crux ${{ github.ref_name }}
          body_path: ${{ steps.changelog.outputs.path }}
          generate_release_notes: true
