name: Android CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: [ubuntu-latest]
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Apply Signing
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          REQUIRE_RELEASE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: bash ./.github/apply_signing.sh

      - name: Run tests
        run: ./gradlew :app:testDebugUnitTest :shared:jvmTest :feature:subscription:jvmTest :feature:agent:jvmTest

      # Version comes from fdroid.properties; BUILD_VERSION/BUILD_NUMBER override it if set.
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify Release APK Signing
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APK=$(ls -1 app/build/outputs/apk/release/*.apk | head -n 1)
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER=$(ls -1 "${SDK_DIR}/build-tools"/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [[ -n "$APKSIGNER" ]]; then
            CERT_INFO=$("$APKSIGNER" verify --print-certs "$APK")
          else
            CERT_INFO=$(keytool -printcert -jarfile "$APK")
          fi
          echo "$CERT_INFO"
          if echo "$CERT_INFO" | grep -qi "Android Debug"; then
            echo "ERROR: Tagged release APK was signed with an ephemeral Android Debug key!" >&2
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crux-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Resolve Changelog Path
        id: changelog
        run: |
          CODE=$(grep versionCode fdroid.properties | cut -d'=' -f2 | tr -d ' ')
          CL="fastlane/metadata/android/en-US/changelogs/${CODE}.txt"
          if [[ -f "$CL" ]]; then
            echo "path=$CL" >> $GITHUB_OUTPUT
          else
            echo "path=README.md" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: app/build/outputs/apk/release/*.apk
          name: Crux ${{ github.ref_name }}
          body_path: ${{ steps.changelog.outputs.path }}
          generate_release_notes: true
